<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier Print — Votre objet, en vrai</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;600;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3" id="b3"></i></div>
<div class="bgt" id="bgt" aria-hidden="true">Mug</div>
<canvas id="gl" aria-hidden="true"></canvas>
<header class="nav glass"><span class="logo"><i></i>Atelier Print</span><nav class="tabs" id="tabs" aria-label="Produits"></nav><button class="cartb" id="cb">Panier · <span id="cn">0</span></button></header>
<section class="hero"><h1>Imprimez l’objet <em>qui vous ressemble.</em></h1><p>Choisissez, personnalisez, tournez-le dans tous les sens. Ce que vous voyez, c’est ce que nous imprimons.</p></section>
<aside class="panel glass" aria-label="Personnaliser votre objet">
  <div class="sec"><label class="ask"><span aria-hidden="true">✦</span><input id="ask" placeholder="Ex : mug rose brillant, 50 pièces, « Sarah »" aria-label="Décrivez votre objet" autocomplete="off"><button id="go" aria-label="Appliquer">↵</button></label><p class="fb" id="fb" aria-live="polite"></p></div>
  <div class="sec"><h3>Couleur</h3><div class="row" id="cl"></div></div>
  <div class="sec"><h3>Votre texte</h3><input class="in" id="tx" maxlength="18" value="Mon Atelier" autocomplete="off"></div>
  <div class="sec"><h3>Logo</h3><label class="drop" id="dp" for="lf"><span id="lt">＋ Ajouter une image</span></label><input type="file" id="lf" accept="image/*" hidden><button class="lnk" id="lr" hidden>Retirer le logo</button></div>
  <div class="sec"><h3>Finition</h3><div class="row" id="fn"></div></div>
  <div class="sec"><h3>Quantité</h3><div class="qs"><button id="mn" aria-label="Moins">−</button><output id="q" aria-live="polite"></output><button id="pl" aria-label="Plus">+</button></div></div>
  <div class="buy"><div><small id="up"></small><b id="pz"></b></div><button class="cta" id="ad">Ajouter au panier</button></div>
</aside>
<dialog id="cd" aria-labelledby="ch"><h2 id="ch">Votre panier</h2><div id="ls"></div><div id="gt" style="font-size:1.6rem;font-weight:700;letter-spacing:-.03em;margin:1rem 0"></div><div style="display:grid;gap:.6rem"><a class="cta" id="mail" style="text-decoration:none;text-align:center;display:grid;align-items:center" href="#">Envoyer ma demande de devis</a><button class="chip" id="cx">Fermer</button></div></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/script.js"></script>
</body>
</html>
